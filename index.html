<!--
  РУМЫНСКИЙ ДЛЯ РУССКОЯЗЫЧНЫХ — веб-версия
  ============================================================

    ЧАСТЬ 1. СОДЕРЖАНИЕ КУРСА       — слова, фразы, грамматика уроков
    ЧАСТЬ 2. СЛОВАРЬ И ПРОФЕССИИ    — тематические наборы лексики
    ЧАСТЬ 3. ДВИЖОК                 — как из данных собирается урок
    ЧАСТЬ 4. ЭКРАНЫ                 — что видит пользователь
    ЧАСТЬ 5. ЗАПУСК

  Содержание (части 1-2) отделено от кода (части 3-5). Добавить новую
  секцию курса или новый профессиональный набор — значит дописать данные,
  не трогая ничего другого.

  ЧЕГО ПОКА НЕТ: аккаунтов. Прогресс сохраняется (см. STORAGE_KEY), но
  только в браузере на этом устройстве — на другом телефоне или компьютере
  его не будет.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Româna — румынский с нуля</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root {
    /* один яркий основной цвет (действия) и один дополнительный (акценты) */
    --primary:      #FF5A2E;   /* тёплый насыщенный оранжевый */
    --primary-dark: #D8420E;   /* тень снизу у толстых кнопок */
    --secondary:    #5B3FCC;   /* насыщенный фиолетовый — акцент */
    --secondary-dark: #4429A8;

    --deep:    #241A42;   /* тёмный фон вводного экрана и итога, в тон фиолетовому */
    --ink:     #241E1C;
    --paper:   #FBF6EE;   /* светлый тёплый фон, не белый и не серый */
    --card:    #FFFFFF;
    --muted:   #8C8177;
    --line:    #EDE3D3;

    --correct:      #17A863;   /* яркий зелёный только для «верно» */
    --correct-dark: #0F8A4E;
    --wrong:        #F0334E;   /* яркий красный только для «неверно» */
    --wrong-dark:   #C41F38;

    --shadow-card: 0 3px 4px rgba(36,26,20,.05), 0 8px 20px rgba(36,26,20,.08);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: Nunito, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  main {
    max-width: 460px;
    margin: 0 auto;
    padding: 18px 16px 96px;
  }

  button { font: inherit; color: inherit; cursor: pointer; }

  .ro { font-weight: 700; letter-spacing: -0.01em; }

  .card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow-card); }

  /* ---- толстая кнопка: тень снизу, «проседает» при нажатии ---- */
  .primary {
    width: 100%; font-weight: 800; font-size: 16px; color: #fff;
    background: var(--primary); border: none; border-radius: 16px; padding: 15px;
    box-shadow: 0 5px 0 var(--primary-dark), 0 8px 16px rgba(255,90,46,.25);
    transform: translateY(0); transition: transform .08s ease, box-shadow .08s ease;
  }
  .primary:active:not(:disabled) {
    transform: translateY(5px);
    box-shadow: 0 0 0 var(--primary-dark), 0 2px 6px rgba(255,90,46,.2);
  }

  .primary:disabled {
    background: var(--line); color: var(--muted); cursor: default;
    box-shadow: 0 5px 0 #DCD0BA;
  }

  .primary:focus-visible, .option:focus-visible, .path-item:focus-visible,
  .chip:focus-visible, .icon-btn:focus-visible, .navbtn:focus-visible,
  .setcard:focus-visible, .tab:focus-visible, .match-item:focus-visible,
  .sound-toggle:focus-visible {
    outline: 3px solid var(--secondary); outline-offset: 2px;
  }

  .hidden { display: none !important; }

  /* мотив: ромбы из народной вышивки — ярче основного текста.
     currentColor внутри <pattern> берёт цвет места ОПРЕДЕЛЕНИЯ узора,
     а не места его использования — поэтому цвет задаём узору напрямую. */
  .motif { display: block; width: 100%; height: 16px; opacity: .95; }
  #rhomb .rhomb-outline { stroke: var(--primary); }
  #rhomb .rhomb-fill { fill: var(--secondary); }

  /* ============ Вводный экран ============ */

  #screen-welcome {
    position: fixed; inset: 0; z-index: 20;
    background: var(--deep); color: #EFEAE3;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 24px; overflow-y: auto;
  }

  .welcome-inner { max-width: 400px; width: 100%; }

  .welcome-title {
    font-size: 58px; font-weight: 900; line-height: 1;
    margin: 0 0 6px; letter-spacing: -0.02em;
  }

  .welcome-sub { color: #C7BEE0; margin: 0 0 26px; font-size: 17px; }

  #screen-welcome .motif { opacity: .9; margin-bottom: 26px; }

  .welcome-list { list-style: none; padding: 0; margin: 0 0 32px; }

  .welcome-list li {
    display: flex; gap: 12px; align-items: baseline;
    padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,.12);
  }

  .welcome-list li:last-child { border-bottom: none; }
  .welcome-list b { font-weight: 700; }
  .welcome-list span { color: #C7BEE0; font-size: 15px; display: block; margin-top: 2px; }
  .welcome-num { font-weight: 900; color: var(--primary); font-size: 19px; }

  .welcome-foot { text-align: center; color: #9C90BD; font-size: 13px; margin: 14px 0 0; }

  .welcome-skip {
    display: block; width: 100%; background: none; border: none;
    color: #C7BEE0; text-align: center; font-weight: 700; font-size: 14px;
    padding: 16px 0 0; text-decoration: underline; text-underline-offset: 3px;
  }

  /* ---- переход «вводный экран → путь курса» ---- */
  @keyframes fadeOutScreen { to { opacity: 0; transform: scale(.98); } }
  @keyframes fadeInScreen { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  #screen-welcome.fade-out { animation: fadeOutScreen .22s ease forwards; }
  #screen-home.fade-in { animation: fadeInScreen .32s ease; }
  @media (prefers-reduced-motion: reduce) {
    #screen-welcome.fade-out, #screen-home.fade-in { animation: none; }
  }

  /* ============ Шапка ============ */

  .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .head h1 { font-size: 28px; font-weight: 900; margin: 0; }
  .streak { font-size: 14px; color: var(--secondary); font-weight: 700; }

  .section-title { font-size: 13px; color: var(--muted); margin: 22px 0 10px; font-weight: 700; }

  /* ============ Юниты: дорожка ============ */

  .path { position: relative; padding: 4px 0 8px; }
  .path::before {
    content: ""; position: absolute; top: 30px; bottom: 30px; left: 30px;
    width: 4px; background: var(--line); border-radius: 2px; z-index: 0;
  }

  .path-item {
    position: relative; z-index: 1; display: flex; align-items: center;
    gap: 14px; width: 100%; background: none; border: none;
    text-align: left; padding: 0; margin-bottom: 18px;
  }
  .path-item.side-right { padding-left: 15%; }

  .path-node {
    width: 60px; height: 60px; border-radius: 50%; flex-shrink: 0;
    background: var(--card); box-shadow: var(--shadow-card);
    border: 4px solid var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 22px; color: var(--primary);
    transition: transform .08s ease;
  }
  .path-item:active:not(:disabled) .path-node { transform: scale(.94); }

  .path-item[data-state="done"] .path-node {
    background: var(--correct); border-color: var(--correct); color: #fff;
  }
  .path-item[data-state="locked"] .path-node {
    background: var(--card); border-color: var(--line); color: var(--muted);
  }
  .path-item[data-state="locked"] { opacity: .55; cursor: default; }

  .path-card {
    flex: 1; min-width: 0; background: var(--card); border-radius: 16px;
    padding: 12px 16px; box-shadow: var(--shadow-card);
  }
  .path-item[data-state="locked"] .path-card { box-shadow: none; }
  .unit-name { font-weight: 800; }
  .unit-sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .unit-mark { float: right; font-size: 13px; color: var(--correct); font-weight: 700; }

  /* ============ Грамматика ============ */

  .note { padding: 24px 22px; margin-bottom: 18px; border-left: 5px solid var(--secondary); }
  .note h2 { font-size: 22px; font-weight: 800; margin: 0 0 14px; }
  .note p { margin: 0 0 12px; }
  .note p:last-of-type { margin-bottom: 0; }
  .note b { font-weight: 800; font-size: 17px; color: var(--secondary); }
  .note table { width: 100%; border-collapse: collapse; margin: 16px 0 4px; font-size: 15px; }
  .note td { padding: 7px 0; border-bottom: 1px solid var(--line); }
  .note td:first-child { font-weight: 700; font-size: 17px; }
  .note td:last-child { color: var(--muted); text-align: right; }
  .note tr:last-child td { border-bottom: none; }

  /* ============ Сценка и история ============ */

  .scene-line { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .scene-line:last-child { border-bottom: none; }
  .scene-who { font-size: 12px; font-weight: 800; color: var(--secondary); text-transform: uppercase; margin-bottom: 3px; }
  .scene-ro { display: block; width: 100%; text-align: left; background: none; border: none;
    padding: 0; font-size: 17px; font-weight: 700; color: var(--ink); }
  .scene-ru { margin-top: 5px; font-size: 14px; color: var(--muted); }
  .story-line { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .story-line:last-child { border-bottom: none; }
  .story-q { padding: 20px 22px; margin-bottom: 14px; text-align: center; }
  .story-q p { font-size: 18px; font-weight: 700; margin: 0 0 16px; }
  .story-tf { display: flex; gap: 10px; justify-content: center; }
  .story-tf button { flex: 1; max-width: 140px; }

  /* ============ Урок ============ */

  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .track { flex: 1; height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--primary); border-radius: 6px; transition: width .3s ease; }
  .quit { background: none; border: none; color: var(--muted); font-size: 24px; line-height: 1; padding: 0 4px; }
  .sound-toggle { background: none; border: none; color: var(--muted); font-size: 19px; line-height: 1; padding: 0 4px; }

  .prompt { padding: 30px 22px 26px; text-align: center; margin-bottom: 20px; }
  .task { font-size: 13px; color: var(--muted); margin: 0 0 16px; font-weight: 700; }
  .subject { font-size: 38px; line-height: 1.15; margin: 0; font-weight: 800; }
  .subject.small { font-size: 26px; }
  .icon-btn { background: none; border: none; color: var(--muted); font-size: 20px; padding: 4px 8px; }

  /* ---- Найди пары ---- */
  .match-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .match-col { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .match-item {
    background: var(--card); border: none; border-radius: 12px;
    padding: 13px 8px; text-align: center; font-weight: 700; font-size: 15px;
    box-shadow: 0 3px 0 var(--line), 0 4px 8px rgba(36,26,20,.06);
    transition: transform .08s ease, box-shadow .08s ease, background .1s ease;
  }
  .match-item.selected { background: var(--secondary); color: #fff; box-shadow: 0 3px 0 var(--secondary-dark); }
  .match-item.matched { background: var(--correct); color: #fff; box-shadow: 0 3px 0 var(--correct-dark); opacity: .85; }
  .match-item.is-wrong { background: var(--wrong); color: #fff; box-shadow: 0 3px 0 var(--wrong-dark); animation: shake .3s ease; }
  .match-item:disabled { cursor: default; }

  /* ---- Циферблат → фраза ---- */
  .clock-face { display: block; margin: 8px auto 4px; }
  .clock-face .clock-rim { fill: var(--card); stroke: var(--ink); stroke-width: 3; }
  .clock-face .clock-tick { stroke: var(--muted); stroke-width: 2; }
  .clock-face .clock-hour { stroke: var(--ink); stroke-width: 5; stroke-linecap: round; }
  .clock-face .clock-min { stroke: var(--primary); stroke-width: 4; stroke-linecap: round; }
  .clock-face .clock-center { fill: var(--primary); }

  .options { display: grid; gap: 10px; margin: 0 0 20px; padding: 0; list-style: none; }
  .option {
    width: 100%; text-align: left; background: var(--card); border: none;
    border-radius: 14px; padding: 15px 18px; font-weight: 700;
    box-shadow: 0 4px 0 var(--line), 0 6px 12px rgba(36,26,20,.06);
    transform: translateY(0); transition: transform .08s ease, box-shadow .08s ease, background .1s ease;
  }
  .option:hover:not(:disabled) { background: #FFF3EC; }
  .option:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--line); }
  .option:disabled { cursor: default; }
  .option.is-correct {
    background: var(--correct); color: #fff;
    box-shadow: 0 4px 0 var(--correct-dark);
    animation: pop .3s ease;
  }
  .option.is-wrong {
    background: var(--wrong); color: #fff;
    box-shadow: 0 4px 0 var(--wrong-dark);
    animation: shake .3s ease;
  }

  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.04); } 100% { transform: scale(1); } }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .option.is-correct, .option.is-wrong { animation: none; }
  }

  .slot { min-height: 56px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; padding: 6px 0 10px; margin-bottom: 18px; }
  .bank { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; min-height: 44px; }
  .chip {
    font-weight: 700; font-size: 17px; background: var(--card); border: none;
    border-radius: 10px; padding: 9px 14px;
    box-shadow: 0 3px 0 var(--line), 0 4px 8px rgba(36,26,20,.06);
  }
  .chip.used { visibility: hidden; }

  .answer-input {
    width: 100%; font: inherit; font-weight: 700;
    font-size: 20px; color: inherit; background: var(--card);
    border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 16px;
  }
  .answer-input:focus { outline: none; border-color: var(--primary); }

  .feedback { min-height: 44px; font-size: 16px; margin-bottom: 12px; font-weight: 700; }
  .feedback.ok { color: var(--correct); }
  .feedback.bad { color: var(--wrong); }
  .feedback .ro { font-size: 17px; }

  /* ============ Итог ============ */

  .result {
    background: var(--deep); color: #EFEAE3;
    border-radius: 22px; padding: 44px 24px 32px; text-align: center; margin-top: 12px;
    position: relative; overflow: hidden;
  }
  .result .motif { opacity: .85; margin-bottom: 24px; }
  .score { font-size: 64px; font-weight: 900; line-height: 1; margin: 0 0 6px; }
  .result p { color: #C7BEE0; margin: 0 0 28px; font-weight: 700; }

  .confetti {
    position: absolute; top: -10px; width: 10px; height: 10px;
    background: var(--primary); opacity: 0; pointer-events: none;
    animation: fall 1.6s ease-in forwards;
  }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(340px) rotate(340deg); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .confetti { animation: none; display: none; } }

  /* ============ Словарь ============ */

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1; background: var(--card); border: none;
    border-radius: 999px; padding: 10px; font-size: 14px; font-weight: 700; color: var(--muted);
    box-shadow: 0 2px 6px rgba(36,26,20,.05);
  }
  .tab[aria-selected="true"] { background: var(--secondary); color: #fff; box-shadow: 0 3px 0 var(--secondary-dark); }

  .search {
    width: 100%; font: inherit; color: inherit; background: var(--card);
    border: 2px solid var(--line); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 16px;
  }
  .search:focus { outline: none; border-color: var(--primary); }

  .entry {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: none;
    border-radius: 14px; padding: 12px 14px; margin-bottom: 8px;
    box-shadow: var(--shadow-card);
  }
  .entry-ro { font-weight: 700; font-size: 18px; }
  .entry-ru { color: var(--muted); font-size: 14px; margin-top: 1px; }
  .entry-text { flex: 1; min-width: 0; }
  .entry-alt { color: var(--muted); font-size: 0.85em; }

  .swatch {
    width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
    border: 1px solid var(--line);
  }
  .num-badge {
    min-width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    background: var(--paper); border: 1px solid var(--line); padding: 0 4px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
  }

  .set-rule { padding: 18px 20px; margin-bottom: 18px; border-left: 5px solid var(--secondary); }
  .set-rule h2 { font-size: 18px; font-weight: 800; margin: 0 0 10px; }
  .set-rule p { margin: 0 0 8px; font-size: 15px; }
  .set-rule p:last-child { margin-bottom: 0; }
  .set-rule b { color: var(--secondary); }

  .setcard {
    display: block; width: 100%; text-align: left;
    background: var(--card); border: none;
    border-radius: 18px; padding: 16px 18px; margin-bottom: 12px;
    box-shadow: var(--shadow-card);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .setcard:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 6px rgba(36,26,20,.08); }
  .setcard[data-soon="1"] { opacity: .45; cursor: default; box-shadow: none; }
  .setcard-name { font-weight: 800; }
  .setcard-sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .setcard-count { float: right; font-size: 13px; color: var(--muted); }

  .back {
    background: none; border: none; color: var(--muted);
    padding: 0; margin-bottom: 14px; font-size: 15px; font-weight: 700;
  }

  .group-title { font-size: 13px; color: var(--muted); margin: 22px 0 10px; font-weight: 700; }

  .empty { color: var(--muted); text-align: center; padding: 30px 0; }

  /* ============ Нижняя навигация ============ */

  nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card); box-shadow: 0 -2px 12px rgba(36,26,20,.08);
    display: flex; padding: 8px 0 22px;
  }

  .navbtn {
    flex: 1; min-width: 0; background: none; border: none;
    color: var(--muted); font-size: 10.5px; padding: 6px 1px 0; font-weight: 700;
    line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .navbtn[aria-current="page"] { color: var(--primary); }
  .navbtn .glyph { display: block; font-size: 18px; margin-bottom: 2px; }

  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>

<!-- мотив определяется один раз и переиспользуется -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="rhomb" width="18" height="14" patternUnits="userSpaceOnUse">
      <path class="rhomb-outline" d="M9 1 L17 7 L9 13 L1 7 Z" fill="none" stroke-width="1.5"/>
      <path class="rhomb-fill" d="M9 4.6 L12.4 7 L9 9.4 L5.6 7 Z"/>
    </pattern>
  </defs>
</svg>

<div id="screen-welcome"></div>

<main>
  <section id="screen-home"></section>
  <section id="screen-note" class="hidden"></section>
  <section id="screen-scene" class="hidden"></section>
  <section id="screen-lesson" class="hidden"></section>
  <section id="screen-result" class="hidden"></section>
  <section id="screen-story" class="hidden"></section>
  <section id="screen-words" class="hidden"></section>
  <section id="screen-sets" class="hidden"></section>
  <section id="screen-practice" class="hidden"></section>
  <section id="screen-progress" class="hidden"></section>
</main>

<nav id="nav" class="hidden">
  <button class="navbtn" data-go="home"><span class="glyph">◈</span>Курс</button>
  <button class="navbtn" data-go="words"><span class="glyph">📖</span>Словарь</button>
  <button class="navbtn" data-go="sets"><span class="glyph">☰</span>Наборы</button>
  <button class="navbtn" data-go="practice"><span class="glyph">⚡</span>Тренировка</button>
  <button class="navbtn" data-go="progress"><span class="glyph">◐</span>Прогресс</button>
</nav>

<script>
/* ==========================================================================
   ЧАСТЬ 1. СОДЕРЖАНИЕ КУРСА
   ========================================================================== */

// Уровни курса (A1, потом A2, A3…). Переключателя в интерфейсе пока
// нет — он появится вместе с A2, — но данные уже размечены по уровням,
// чтобы новый уровень не потребовал переделки. totalUnits — из
// course-a1.md, для строки «Уровень A1 · N из 38» над путём курса.
const LEVELS = {
  A1: { title: "Уровень A1", totalUnits: 40 }
};

  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}

function yesterday() {
  const d = new Date(Date.now() - 86400000);
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const saved = JSON.parse(raw);

    state.done = Array.isArray(saved.done) ? saved.done : [];
    state.lastDay = saved.lastDay || null;

    // Стрик жив, если последний урок был сегодня или вчера. Иначе сгорел.
    if (state.lastDay === today() || state.lastDay === yesterday()) {
      state.streak = saved.streak || 1;
    } else {
      state.streak = 0;
    }
    return saved;
  } catch (e) {
    return null;   // хранилище недоступно — работаем без сохранения
  }
}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      done: state.done,
      streak: state.streak,
      lastDay: state.lastDay
    }));
  } catch (e) {
    /* не сохранилось — не страшно, урок всё равно засчитан в этой сессии */
  }
}

function markDayDone() {
  const t = today();
  if (state.lastDay === t) return;              // сегодня уже отмечались
  if (state.lastDay === yesterday()) state.streak++;
  else state.streak = 1;                        // первый день или перерыв
  state.lastDay = t;
}

function resetProgress() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  state.done = [];
  state.streak = 0;
  state.lastDay = null;
}

/* ---------- Работа над ошибками ----------
   Отдельное хранилище от прогресса юнитов: список слов/фраз, на
   которые был дан неверный ответ (по парам ro/ru — этого достаточно
   для карточки на повтор). Юнит помечается пройденным независимо от
   ошибок внутри урока — это к «работе над ошибками» не относится. */

const MISTAKES_KEY = "romana:mistakes";

function loadMistakes() {
  try { return JSON.parse(localStorage.getItem(MISTAKES_KEY)) || []; }
  catch (e) { return []; }
}

function saveMistakes(list) {
  try { localStorage.setItem(MISTAKES_KEY, JSON.stringify(list)); }
  catch (e) {}
}

function recordMistake(ro, ru) {
  if (!ro || !ru) return;
  const list = loadMistakes();
  if (!list.some(m => m.ro === ro)) {
    list.push({ ro, ru });
    saveMistakes(list);
  }
}

function clearMistake(ro) {
  saveMistakes(loadMistakes().filter(m => m.ro !== ro));
}

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Сравнение без диакритики: "buna" засчитывается вместо "bună".
function normalize(s) {
  return s.toLowerCase().trim()
    .replace(/ă|â/g, "a").replace(/î/g, "i")
    .replace(/ș|ş/g, "s").replace(/ț|ţ/g, "t")
    .replace(/[.,!?]/g, "").replace(/\s+/g, " ");
}

// Временная озвучка синтезом речи браузера. Настоящее аудио запишут носители.
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ro-RO"; u.rate = 0.9;
  speechSynthesis.speak(u);
}

// Несколько фраз подряд одной очередью — для «прослушать» у сценки
// и истории: speak() каждый раз отменяет предыдущее, а здесь реплики
// нужно проговорить одну за другой.
function speakSequence(texts) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  texts.forEach(t => {
    const u = new SpeechSynthesisUtterance(t);
    u.lang = "ro-RO"; u.rate = 0.9;
    speechSynthesis.speak(u);
  });
}

/* ---------- Звук ответа ----------
   Два коротких сигнала синтезируются на лету через Web Audio — без
   аудиофайлов, чтобы приложение оставалось одним файлом. Настройка
   «звук выключен» хранится отдельно от прогресса и переживает сброс. */

const SOUND_KEY = "romana:sound";

function loadSoundPref() {
  try { state.sound = localStorage.getItem(SOUND_KEY) !== "off"; }
  catch (e) { state.sound = true; }
}

function toggleSound() {
  state.sound = !state.sound;
  try { localStorage.setItem(SOUND_KEY, state.sound ? "on" : "off"); }
  catch (e) {}
}

let audioCtx = null;
function tone(freq, start, dur, gain) {
  if (!state.sound) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const vol = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    vol.gain.value = gain;
    vol.gain.setTargetAtTime(0, audioCtx.currentTime + start + dur, 0.03);
    osc.connect(vol); vol.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + start);
    osc.stop(audioCtx.currentTime + start + dur + 0.1);
  } catch (e) { /* Web Audio недоступен — молча без звука */ }
}

function playCorrect() { tone(523.25, 0, .1, .12); tone(783.99, .1, .16, .12); }
function playWrong()   { tone(196, 0, .18, .12); }

function unitIndex(id) { return COURSE.units.findIndex(u => u.id === id); }

function isUnlocked(i) {
  // Уже пройденный юнит остаётся открытым всегда — даже если позже
  // перед ним появится новая секция, которой не было в чьём-то прогрессе.
  if (state.done.includes(COURSE.units[i].id)) return true;
  return i === 0 || state.done.includes(COURSE.units[i - 1].id);
}

function buildLesson(unit) {
  const idx = unitIndex(unit.id);
  const oldWords = COURSE.units.slice(0, idx).filter(u => !u.isStory).flatMap(u => u.words);
  const allWords = COURSE.units.filter(u => !u.isStory).flatMap(u => u.words);
  const tasks = [];

  shuffle(unit.words).slice(0, 5).forEach(w =>
    tasks.push({ type: "choice", dir: "ro-ru", word: w, pool: allWords }));
  shuffle(unit.words).slice(0, 2).forEach(w =>
    tasks.push({ type: "choice", dir: "ru-ro", word: w, pool: allWords }));
  shuffle(unit.phrases).slice(0, 2).forEach(p =>
    tasks.push({ type: "assemble", phrase: p }));
  // Обычные юниты — 2 задания на пропуск, в общей жеребьёвке ниже.
  // extraGaps идёт не сюда, а в reserved (см. ниже): иначе жеребьёвка
  // могла случайно срезать почти все повторения одного правила.
  if (!unit.extraGaps) {
    shuffle(unit.gaps).slice(0, 2).forEach(g =>
      tasks.push({ type: "gap", gap: g }));
  }

  const typed = shuffle(unit.words.filter(w => !w.ro.includes(" ")))[0];
  if (typed) tasks.push({ type: "input", word: typed });

  shuffle(oldWords).slice(0, 2).forEach(w =>
    tasks.push({ type: "choice", dir: "ro-ru", word: w, pool: allWords }));

  // Задания с гарантированным местом в уроке (не участвуют в общей
  // жеребьёвке, чтобы не потеряться среди остального): «Найди пары»
  // всегда, «как читается» и «циферблат» — по флагу юнита, extraGaps —
  // для юнита, где одно правило требует особенно много однотипной
  // тренировки подряд (см. CLAUDE.md, «Как строить секции курса»).
  const reserved = [];

  if (unit.extraGaps) {
    shuffle(unit.gaps).slice(0, unit.extraGaps).forEach(g =>
      reserved.push({ type: "gap", gap: g }));
  }

  const matchPool = unit.words.length >= 5 ? unit.words
    : unit.words.concat(oldWords).filter((w, i, arr) => arr.findIndex(x => x.ro === w.ro) === i);
  const matchWords = shuffle(matchPool).slice(0, 5);
  if (matchWords.length === 5) reserved.push({ type: "match", words: matchWords });

  if (unit.readCombos) {
    shuffle(READ_COMBOS).slice(0, 2).forEach(c =>
      reserved.push({ type: "read", combo: c.combo, answer: c.reading }));
  }

  if (unit.clockTimes) {
    shuffle(CLOCK_TIMES).slice(0, 2).forEach(t =>
      reserved.push({ type: "clock", h: t.h, m: t.m, answer: t.phrase }));
  }

  const picked = shuffle(tasks).slice(0, 12 - reserved.length);
  return shuffle(picked.concat(reserved));
}

/* ==========================================================================
   ЧАСТЬ 4. ЭКРАНЫ
   ========================================================================== */

const screens = {
  welcome:  document.getElementById("screen-welcome"),
  home:     document.getElementById("screen-home"),
  note:     document.getElementById("screen-note"),
  scene:    document.getElementById("screen-scene"),
  lesson:   document.getElementById("screen-lesson"),
  result:   document.getElementById("screen-result"),
  story:    document.getElementById("screen-story"),
  words:    document.getElementById("screen-words"),
  sets:     document.getElementById("screen-sets"),
  practice: document.getElementById("screen-practice"),
  progress: document.getElementById("screen-progress")
};

const nav = document.getElementById("nav");

const MOTIF = '<svg class="motif" aria-hidden="true"><rect width="100%" height="14" fill="url(#rhomb)"/></svg>';

// Экраны, на которых нижняя навигация скрыта — это середина урока,
// сценка или история, а не самостоятельный раздел приложения.
const NAV_HIDDEN_SCREENS = ["welcome", "scene", "lesson", "story"];

function show(name) {
  Object.entries(screens).forEach(([k, el]) => el.classList.toggle("hidden", k !== name));
  nav.classList.toggle("hidden", NAV_HIDDEN_SCREENS.includes(name));
  nav.querySelectorAll(".navbtn").forEach(b => {
    b.setAttribute("aria-current", b.dataset.go === name ? "page" : "false");
  });
  window.scrollTo(0, 0);
}

nav.querySelectorAll(".navbtn").forEach(b => {
  b.onclick = () => {
    const go = b.dataset.go;
    if (go === "home")     { renderHome(); show("home"); }
    else if (go === "words")    { renderWords(); show("words"); }
    else if (go === "sets")     { state.openSet = null; renderSets(); show("sets"); }
    else if (go === "practice") { renderPractice(); show("practice"); }
    else if (go === "progress") { renderProgress(); show("progress"); }
  };
});

/* ---------- Вводный экран ----------
   Два варианта одного экрана: для первого визита (полная подача — что
   за курс и как устроено обучение) и для повторного (короткое
   приветствие со стриком). У обоих — ссылка в словарь без начала курса:
   учиться сразу не обязательно, посмотреть слова можно и так. */

function welcomeSkipLink() {
  return `<button class="welcome-skip" id="skip-dict">Посмотреть словарь без урока</button>`;
}

function wireWelcomeButtons() {
  screens.welcome.querySelector("#start").onclick = goToPath;
  screens.welcome.querySelector("#skip-dict").onclick = () => {
    renderWords(); show("words");
  };
}

function renderWelcome() {
  const totalWords = COURSE.units.flatMap(u => u.words).length
                   + SETS.filter(s => !s.soon).flatMap(s => s.words).length;

  screens.welcome.innerHTML = `
    <div class="welcome-inner">
      <h1 class="welcome-title">Româna</h1>
      <p class="welcome-sub">Румынский с нуля — объяснения на русском, без английского посредника</p>
      ${MOTIF}
      <ul class="welcome-list">
        <li><span class="welcome-num">1</span><div>
          <b>Без английского посредника</b>
          <span>Объяснения идут от русского языка, а не через третий</span>
        </div></li>
        <li><span class="welcome-num">2</span><div>
          <b>Грамматику объясняем</b>
          <span>Короткое правило перед уроком, а не угадывание закономерностей</span>
        </div></li>
        <li><span class="welcome-num">3</span><div>
          <b>Слова для работы</b>
          <span>Общепит, документы, стройка, аптека — отдельным словарём</span>
        </div></li>
      </ul>
      <button class="primary" id="start">Начать обучение</button>
      ${welcomeSkipLink()}
      <p class="welcome-foot">${totalWords} слов и фраз · без регистрации</p>
    </div>
  `;

}

function renderWelcomeBack() {
  const greeting = state.streak > 0
    ? `С возвращением! ${state.streak} ${dayWord(state.streak)} подряд`
    : "С возвращением!";

  screens.welcome.innerHTML = `
    <div class="welcome-inner">
      <h1 class="welcome-title">Româna</h1>
      <p class="welcome-sub">${greeting}</p>
      ${MOTIF}
      <button class="primary" id="start">Продолжить</button>
      ${welcomeSkipLink()}
    </div>
  `;

}

// Переход к пути курса — с лёгким затуханием, если устройство не просит
// уменьшить движение (prefers-reduced-motion уважаем и здесь, и в CSS).
function goToPath() {
  const reduced = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const proceed = () => {
    renderHome();
    show("home");
    if (!reduced) {
      screens.home.classList.add("fade-in");
      setTimeout(() => screens.home.classList.remove("fade-in"), 350);
    }
  };

  if (reduced) { proceed(); return; }
  screens.welcome.classList.add("fade-out");
  setTimeout(proceed, 220);
}

/* ---------- Главный экран ---------- */

function renderHome() {
  // Переключателя уровней ещё нет — пока всегда A1, но именно из-за
  // этой константы, а не из захардкоженных текстов ниже: A2 подключится
  // добавлением записи в LEVELS без переделки этой функции.
  const level = "A1";
  // «История» (unit.isStory) — не юнит, в счёт «N из 40» не входит,
  // но всё равно идёт на пути внутри своей секции (см. ниже).
  const levelUnits = COURSE.units.filter(u => u.level === level && !u.isStory);
  const levelDone = levelUnits.filter(u => state.done.includes(u.id)).length;

  // Юниты сгруппированы по секциям — у каждой секции свой заголовок
  // и своя дорожка (собственная соединяющая линия, см. .path в CSS).
  const sections = [];
  COURSE.units.filter(u => u.level === level).forEach(unit => {
    let group = sections.find(s => s.num === unit.section);
    if (!group) { group = { num: unit.section, units: [] }; sections.push(group); }
    group.units.push(unit);
  });

  screens.home.innerHTML = `
    <div class="head">
      <h1 class="ro">Româna</h1>
      <span class="streak">${state.streak > 0
        ? state.streak + " " + dayWord(state.streak) + " подряд"
        : "Начните сегодня"}</span>
    </div>
    ${MOTIF}
    <p class="section-title" style="margin-top:0">${LEVELS[level].title} · ${levelDone} из ${LEVELS[level].totalUnits}</p>
    <div id="unit-list"></div>
    ${levelDone ? '<button class="back" id="reset" style="margin-top:6px">Сбросить прогресс</button>' : ""}
  `;

  const reset = screens.home.querySelector("#reset");
  if (reset) reset.onclick = () => {
    if (confirm("Сбросить весь прогресс и начать заново?")) {
      resetProgress();
      renderHome();
    }
  };

  const list = screens.home.querySelector("#unit-list");

  sections.forEach(group => {
    const countedUnits = group.units.filter(u => !u.isStory);
    const sectionDone = countedUnits.filter(u => state.done.includes(u.id)).length;
    const heading = document.createElement("p");
    heading.className = "section-title";
    heading.textContent =
      `Секция ${group.num} · ${SECTION_TITLES[level][group.num]} · ${sectionDone} из ${countedUnits.length}`;
    list.appendChild(heading);

    const path = document.createElement("div");
    path.className = "path";
    list.appendChild(path);

    // Кружок-веха слева/справа по очереди, карточка с названием рядом.
    group.units.forEach(unit => {
      const i = unitIndex(unit.id);
      const unlocked = isUnlocked(i);
      const finished = state.done.includes(unit.id);
      const btn = document.createElement("button");
      btn.className = "path-item" + (i % 2 ? " side-right" : "");
      btn.dataset.state = finished ? "done" : unlocked ? "open" : "locked";
      btn.disabled = !unlocked;
      const nodeContent = unit.isStory ? (unlocked ? "📖" : "🔒")
        : finished ? "✓" : unlocked ? String(i + 1) : "🔒";
      btn.innerHTML = `
        <span class="path-node">${nodeContent}</span>
        <span class="path-card">
          ${finished ? '<span class="unit-mark">пройден</span>' : ""}
          <div class="unit-name">${unit.name}</div>
          <div class="unit-sub">${unit.sub}</div>
        </span>
      `;
      btn.onclick = () => startUnit(unit);
      path.appendChild(btn);
    });
  });
}

function dayWord(n) {
  const last = n % 10, two = n % 100;
  if (two >= 11 && two <= 14) return "дней";
  if (last === 1) return "день";
  if (last >= 2 && last <= 4) return "дня";
  return "дней";
}

/* ---------- Грамматика ---------- */

function startUnit(unit) {
  if (unit.isStory) return startStory(unit);
  if (unit.scene) return showScene(unit);
  return startNoteOrLesson(unit);
}

function startNoteOrLesson(unit) {
  if (!unit.grammar) return startLesson(unit);
  const g = unit.grammar;
  screens.note.innerHTML = `
    <div class="card note">
      <h2>${g.title}</h2>
      ${g.body.map(p => `<p>${p}</p>`).join("")}
      ${g.table ? `<table>${g.table.map(r =>
        `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table>` : ""}
    </div>
    <button class="primary" id="note-go">Начать урок</button>
  `;
  screens.note.querySelector("#note-go").onclick = () => startLesson(unit);
  show("note");
}

/* ---------- Сценка ----------
   Короткий диалог перед заметкой: 4-6 реплик, «прослушать» целиком
   и перевод по нажатию на реплику. Проба новой подачи — только для
   секции 8 (unit.scene), остальные юниты этого поля не имеют. */

function showScene(unit) {
  const scene = unit.scene;
  screens.scene.innerHTML = `
    <div class="head"><h1 class="ro">${unit.name}</h1></div>
    <button class="icon-btn" id="scene-listen" aria-label="Прослушать сценку" style="margin-bottom:12px">🔊 Прослушать</button>
    <div class="card" style="padding:16px 18px;" id="scene-lines"></div>
    <button class="primary" id="scene-next" style="margin-top:16px">Продолжить</button>
  `;

  const linesEl = screens.scene.querySelector("#scene-lines");
  scene.forEach((line, i) => {
    const row = document.createElement("div");
    row.className = "scene-line";
    row.innerHTML = `
      <div class="scene-who">${line.who}</div>
      <button class="scene-ro" data-i="${i}">${line.ro}</button>
      <div class="scene-ru hidden" id="scene-ru-${i}">${line.ru}</div>
    `;
    linesEl.appendChild(row);
  });
  linesEl.querySelectorAll(".scene-ro").forEach(btn => {
    btn.onclick = () => {
      screens.scene.querySelector("#scene-ru-" + btn.dataset.i).classList.toggle("hidden");
    };
  });

  screens.scene.querySelector("#scene-listen").onclick = () => speakSequence(scene.map(l => l.ro));
  screens.scene.querySelector("#scene-next").onclick = () => startNoteOrLesson(unit);
  show("scene");
}

/* ---------- Урок ---------- */

function startLesson(unit) {
  state.current = { unit, tasks: buildLesson(unit) };
  state.step = 0; state.score = 0;
  show("lesson");
  renderTask();
}

function renderTask() {
  const { tasks } = state.current;
  const task = tasks[state.step];
  state.answered = false;

  screens.lesson.innerHTML = `
    <div class="top">
      <button class="quit" id="quit" aria-label="Выйти из урока">&times;</button>
      <div class="track"><div class="fill" style="width:${state.step / tasks.length * 100}%"></div></div>
      <button class="sound-toggle" id="sound" aria-label="Звук">${state.sound ? "🔊" : "🔇"}</button>
    </div>
    <div id="body"></div>
    <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    <button class="primary" id="next" disabled>Дальше</button>
  `;

  screens.lesson.querySelector("#quit").onclick = () => { renderHome(); show("home"); };
  screens.lesson.querySelector("#next").onclick = nextTask;
  screens.lesson.querySelector("#sound").onclick = e => {
    toggleSound();
    e.target.textContent = state.sound ? "🔊" : "🔇";
  };

  const body = screens.lesson.querySelector("#body");
  if (task.type === "choice")   renderChoice(body, task);
  if (task.type === "gap")      renderGap(body, task);
  if (task.type === "assemble") renderAssemble(body, task);
  if (task.type === "input")    renderInput(body, task);
  if (task.type === "match")    renderMatch(body, task);
  if (task.type === "read")     renderRead(body, task);
  if (task.type === "clock")    renderClock(body, task);
}

function renderChoice(body, task) {
  const toRu = task.dir === "ro-ru";
  const w = task.word;
  const question = toRu ? w.ro : w.ru;
  const answer   = toRu ? w.ru : w.ro;

  const wrong = shuffle(task.pool.filter(x => (toRu ? x.ru : x.ro) !== answer))
                  .slice(0, 3).map(x => toRu ? x.ru : x.ro);

  body.innerHTML = `
    <div class="card prompt">
      <p class="task">${toRu ? "Как переводится?" : "Как сказать по-румынски?"}</p>
      <p class="subject ${question.length > 12 ? "small" : ""} ${toRu ? "ro" : ""}">${question}</p>

}

function clockSVG(h, m) {
  const hourAngle = ((h % 12) + m / 60) * 30;
  const minAngle = m * 6;
  const ticks = [...Array(12)].map((_, i) => {
    const a = i * 30 * Math.PI / 180;
    const x1 = 70 + 56 * Math.sin(a), y1 = 70 - 56 * Math.cos(a);
    const x2 = 70 + 63 * Math.sin(a), y2 = 70 - 63 * Math.cos(a);
    return `<line class="clock-tick" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  }).join("");
  return `
    <svg class="clock-face" width="140" height="140" viewBox="0 0 140 140" aria-hidden="true">
      <circle class="clock-rim" cx="70" cy="70" r="66"/>
      ${ticks}
      <line class="clock-hour" x1="70" y1="70" x2="70" y2="38" transform="rotate(${hourAngle} 70 70)"/>
      <line class="clock-min" x1="70" y1="70" x2="70" y2="24" transform="rotate(${minAngle} 70 70)"/>
      <circle class="clock-center" cx="70" cy="70" r="4"/>
    </svg>
  `;
}

function renderClock(body, task) {
  body.innerHTML = `
    <div class="card prompt">
      <p class="task">Сколько времени?</p>
      ${clockSVG(task.h, task.m)}
    </div>
    <ul class="options" id="options"></ul>
  `;
  const wrong = shuffle(CLOCK_TIMES.filter(t => t.phrase !== task.answer))
                  .slice(0, 3).map(t => t.phrase);
  buildOptions(body, shuffle(wrong.concat(task.answer)), task.answer, true);
}

function buildOptions(body, choices, answer, romanian) {
  const list = body.querySelector("#options");
  choices.forEach(choice => {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.className = "option" + (romanian ? " ro" : "");
    btn.textContent = choice;
    btn.onclick = () => {
      if (state.answered) return;
      list.querySelectorAll("button").forEach(b => {
        b.disabled = true;
        if (b.textContent === answer) b.classList.add("is-correct");
      });
      if (choice === answer) finishTask(true);
      else { btn.classList.add("is-wrong"); finishTask(false, answer); }
    };
    li.appendChild(btn);
    list.appendChild(li);
  });
}

function renderAssemble(body, task) {
  const p = task.phrase;
  const words = p.ro.split(" ");

  body.innerHTML = `
    <div class="card prompt">
      <p class="task">Соберите фразу</p>
      <p class="subject small">${p.ru}</p>
    </div>
    <div class="slot" id="slot"></div>
    <div class="bank" id="bank"></div>
  `;

  const slot = body.querySelector("#slot");
  const bank = body.querySelector("#bank");
  const picked = [];

  shuffle(words).forEach(word => {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.textContent = word;
    chip.onclick = () => {
      if (state.answered) return;
      chip.classList.add("used");
      const inSlot = document.createElement("button");
      inSlot.className = "chip";
      inSlot.textContent = word;
      inSlot.onclick = () => {
        if (state.answered) return;
        inSlot.remove();
        chip.classList.remove("used");
        picked.splice(picked.indexOf(inSlot), 1);
        check();
      };
      slot.appendChild(inSlot);
      picked.push(inSlot);
      check();
    };
    bank.appendChild(chip);
  });

  function check() {
    const btn = screens.lesson.querySelector("#next");
    if (picked.length !== words.length) { btn.disabled = true; return; }
    const built = picked.map(c => c.textContent).join(" ");
    if (normalize(built) === normalize(p.ro)) finishTask(true, null, p.ro);
    else finishTask(false, p.ro);
  }
}

function renderInput(body, task) {

}

function renderMatch(body, task) {
  const words = task.words;

  body.innerHTML = `
    <div class="card prompt">
      <p class="task">Найдите пары</p>
      <p class="subject small">Румынское слово — русский перевод</p>
    </div>
    <div class="match-row">
      <div class="match-col" id="col-ro"></div>
      <div class="match-col" id="col-ru"></div>
    </div>
  `;

  const colRo = body.querySelector("#col-ro");
  const colRu = body.querySelector("#col-ru");
  let matchedCount = 0;
  let selected = null;   // { key, btn } — текущий выбранный элемент любой колонки
  let busy = false;      // блокирует клики на время показа ошибки

  function makeItem(key, label, ro) {
    const btn = document.createElement("button");
    btn.className = "match-item" + (ro ? " ro" : "");
    btn.textContent = label;
    btn.onclick = () => pick(key, btn);
    return btn;
  }

  shuffle(words).forEach(w => colRo.appendChild(makeItem(w.ro, w.ro, true)));
  shuffle(words).forEach(w => colRu.appendChild(makeItem(w.ro, w.ru, false)));

  function pick(key, btn) {
    if (state.answered || busy || btn.disabled) return;

    if (!selected) {
      selected = { key, btn };
      btn.classList.add("selected");
      return;
    }
    if (selected.btn === btn) {
      selected.btn.classList.remove("selected");
      selected = null;
      return;
    }

    if (selected.key === key) {
      selected.btn.classList.add("matched");
      btn.classList.add("matched");
      selected.btn.disabled = true;
      btn.disabled = true;
      selected.btn.classList.remove("selected");
      selected = null;
      matchedCount++;
      if (matchedCount === words.length) finishTask(true);
    } else {
      busy = true;
      const prevBtn = selected.btn;
      prevBtn.classList.remove("selected");
      prevBtn.classList.add("is-wrong");
      btn.classList.add("is-wrong");
      selected = null;
      setTimeout(() => {
        prevBtn.classList.remove("is-wrong");
        btn.classList.remove("is-wrong");
        busy = false;
      }, 400);
    }
  }
}

function finishTask(ok, correctAnswer, spellNote) {
  state.answered = true;
  const fb = screens.lesson.querySelector("#feedback");
  const next = screens.lesson.querySelector("#next");

  if (ok) {
    state.score++;
    fb.className = "feedback ok";
    fb.innerHTML = spellNote ? `Верно · <span class="ro">${spellNote}</span>` : "Верно";
    playCorrect();
  } else {
    fb.className = "feedback bad";
    fb.innerHTML = `Правильно: <span class="ro">${correctAnswer}</span>`;
    playWrong();
    // «Работа над ошибками» запоминает только задания с понятной парой
    // ro/ru (выбор перевода, ввод слова, сборка фразы) — у пропуска
    // слова и «Найди пары» такой пары нет.
    const task = state.current.tasks[state.step];
    if (task.type === "choice" || task.type === "input") recordMistake(task.word.ro, task.word.ru);
    else if (task.type === "assemble") recordMistake(task.phrase.ro, task.phrase.ru);
  }
  next.disabled = false;
  next.focus();
}

function nextTask() {
  state.step++;
  if (state.step < state.current.tasks.length) renderTask();
  else {
    if (!state.done.includes(state.current.unit.id)) state.done.push(state.current.unit.id);
    markDayDone();
    saveProgress();
    renderResult();
  }
}

function renderResult() {
  const total = state.current.tasks.length;
  screens.result.innerHTML = `
    <div class="result">
      ${MOTIF}
      <p class="score">${state.score}/${total}</p>
      <p>${state.score === total ? "Без единой ошибки" : "Ошибки вернутся в следующих уроках"}</p>
      <button class="primary" id="back">Дальше</button>
    </div>
  `;
  screens.result.querySelector("#back").onclick = () => { renderHome(); show("home"); };
  spawnConfetti(screens.result.querySelector(".result"));
  show("result");
}

// Праздничный экран: ромбы того же мотива падают и гаснут. Своя мини-анимация
// вместо библиотеки конфетти — приложение остаётся одним файлом без зависимостей.
function spawnConfetti(container) {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["var(--primary)", "var(--secondary)", "var(--correct)"];
  for (let i = 0; i < 26; i++) {
    const piece = document.createElement("span");
    piece.className = "confetti";
    piece.style.left = Math.random() * 100 + "%";
    piece.style.background = colors[i % colors.length];
    piece.style.animationDelay = (Math.random() * .4) + "s";
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
    container.appendChild(piece);
  }
}

function storyQuestion(unit, idx, score) {
  const qs = unit.questions;

  if (idx >= qs.length) {
    if (!state.done.includes(unit.id)) state.done.push(unit.id);
    saveProgress();
    screens.story.innerHTML = `
      <div class="result">
        ${MOTIF}
        <p class="score">${score}/${qs.length}</p>
        <p>История прочитана</p>
        <button class="primary" id="story-back">Дальше</button>
      </div>
    `;
    screens.story.querySelector("#story-back").onclick = () => { renderHome(); show("home"); };
    return;
  }

  const q = qs[idx];
  screens.story.innerHTML = `
    <div class="head"><h1 class="ro">${unit.name}</h1></div>
    <p class="section-title" style="margin-top:0">Вопрос ${idx + 1} из ${qs.length}</p>
    <div class="card story-q"><p class="ro">${q.ro}</p></div>
    <div class="story-tf">
      <button class="primary" id="tf-true">Верно</button>
      <button class="primary" id="tf-false">Неверно</button>
    </div>
    <p class="feedback" id="story-fb" role="status" aria-live="polite"></p>
  `;

  let answered = false;
  function answer(val) {
    if (answered) return;
    answered = true;
    const ok = val === q.answer;
    const fb = screens.story.querySelector("#story-fb");
    fb.className = "feedback " + (ok ? "ok" : "bad");
    fb.textContent = ok ? "Верно" : ("На самом деле — " + (q.answer ? "верно" : "неверно"));
    if (ok) playCorrect(); else playWrong();
    setTimeout(() => storyQuestion(unit, idx + 1, score + (ok ? 1 : 0)), 900);
  }
  screens.story.querySelector("#tf-true").onclick = () => answer(true);
  screens.story.querySelector("#tf-false").onclick = () => answer(false);
}

function entryRow(w) {

              : typeof w.n === "number" ? `<span class="num-badge">${w.n}</span>`
              : "";
  const roLine = w.roF && w.roF !== w.ro ? `${w.ro} <span class="entry-alt">${w.roF}</span>` : w.ro;
  const ruLine = w.ruF && w.ruF !== w.ru ? `${w.ru} <span class="entry-alt">${w.ruF}</span>` : w.ru;

  row.innerHTML = `
    ${badge}
    <div class="entry-text">
      <div class="entry-ro">${roLine}</div>
      <div class="entry-ru">${ruLine}</div>
    </div>

}

/* ---------- Тренировка ----------
   Три режима поверх уже пройденного материала — не замена урокам,
   а дополнительная практика. Блиц и аудирование берут слова только
   из пройденных юнитов; работа над ошибками — из отдельного
   хранилища MISTAKES_KEY, которое пополняет finishTask. */

function donePool() {
  return COURSE.units.filter(u => state.done.includes(u.id)).flatMap(u => u.words);
}

function renderPractice() {
  const pool = donePool();
  const enoughForQuiz = pool.length >= 4;
  const mistakes = loadMistakes();
  const blitzBest = Number(localStorage.getItem("romana:blitzBest") || 0);

  screens.practice.innerHTML = `
    <div class="head"><h1 class="ro">Тренировка</h1></div>
    ${enoughForQuiz ? "" : '<p class="empty">Сначала пройдите хотя бы один юнит курса — тренировка берёт слова из пройденного.</p>'}
    <div id="practice-list"></div>
  `;

  const list = screens.practice.querySelector("#practice-list");

  const items = [
    {
      id: "blitz", icon: "⚡", name: "Блиц",
      sub: blitzBest ? `60 секунд на скорость · лучший счёт: ${blitzBest}` : "60 секунд, выбор перевода на скорость",
      enabled: enoughForQuiz, onClick: startBlitz
    },
    {
      id: "listen", icon: "🔊", name: "Аудирование",
      sub: "Послушайте слово, выберите перевод",
      enabled: enoughForQuiz, onClick: startListening
    },
    {
      id: "mistakes", icon: "🔁", name: "Работа над ошибками",
      sub: mistakes.length ? `${mistakes.length} слов на повтор` : "Пока нет ошибок — и хорошо",
      enabled: mistakes.length > 0, onClick: startMistakes
    }
  ];

  items.forEach(item => {
    const btn = document.createElement("button");
    btn.className = "setcard";
    btn.disabled = !item.enabled;
    btn.innerHTML = `
      <div class="setcard-name">${item.icon} ${item.name}</div>
      <div class="setcard-sub">${item.sub}</div>
    `;
    if (item.enabled) btn.onclick = item.onClick;
    list.appendChild(btn);
  });
}

function practiceOptions(pool, correct, dir) {
  // dir: "ro-ru" — вопрос на румынском, варианты перевода на русском.
  const wrong = shuffle(pool.filter(x => x.ru !== correct.ru)).slice(0, 3).map(x => x.ru);
  return shuffle(wrong.concat(correct.ru));
}

function startBlitz() {
  const pool = donePool();
  if (pool.length < 4) return renderPractice();
  let score = 0;
  let timeLeft = 60;

  function ask() {
    const w = shuffle(pool)[0];
    const opts = practiceOptions(pool, w);
    screens.practice.innerHTML = `
      <button class="back" id="back">← Тренировка</button>
      <div class="head"><h1 class="ro">Блиц</h1></div>
      <p class="section-title" style="margin-top:0">Осталось: <span id="time">${timeLeft}</span> с · Счёт: <span id="score">${score}</span></p>
      <div class="card prompt"><p class="subject ro">${w.ro}</p></div>
      <ul class="options" id="opts"></ul>
    `;
    screens.practice.querySelector("#back").onclick = () => { clearInterval(timer); renderPractice(); };
    const optList = screens.practice.querySelector("#opts");
    opts.forEach(opt => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.className = "option";
      btn.textContent = opt;
      btn.onclick = () => {
        if (timeLeft <= 0) return;
        if (opt === w.ru) score++;
        ask();
      };
      li.appendChild(btn);
      optList.appendChild(li);
    });
  }

  function finish() {
    clearInterval(timer);
    const best = Math.max(score, Number(localStorage.getItem("romana:blitzBest") || 0));
    try { localStorage.setItem("romana:blitzBest", String(best)); } catch (e) {}
    screens.practice.innerHTML = `
      <button class="back" id="back">← Тренировка</button>
      <div class="head"><h1 class="ro">Блиц окончен</h1></div>
      <p class="section-title" style="margin-top:0">Счёт: ${score} · Лучший результат: ${best}</p>
      <button class="primary" id="again">Ещё раз</button>
    `;
    screens.practice.querySelector("#back").onclick = () => renderPractice();
    screens.practice.querySelector("#again").onclick = () => startBlitz();
  }

  const timer = setInterval(() => {
    timeLeft--;
    const t = screens.practice.querySelector("#time");
    if (t) t.textContent = timeLeft;
    if (timeLeft <= 0) finish();
  }, 1000);

  ask();
}

function startListening() {
  const pool = donePool();
  if (pool.length < 4) return renderPractice();
  const total = Math.min(10, pool.length);
  const queue = shuffle(pool).slice(0, total);
  let idx = 0, score = 0;

  function ask() {
    if (idx >= queue.length) return finish();
    const w = queue[idx];
    const opts = practiceOptions(pool, w);
    screens.practice.innerHTML = `
      <button class="back" id="back">← Тренировка</button>
      <div class="head"><h1 class="ro">Аудирование</h1></div>
      <p class="section-title" style="margin-top:0">${idx + 1} из ${total}</p>
      <div class="card prompt">
        <button class="icon-btn" id="say" aria-label="Прослушать">🔊</button>
      </div>
      <ul class="options" id="opts"></ul>
    `;
    screens.practice.querySelector("#back").onclick = () => renderPractice();
    screens.practice.querySelector("#say").onclick = () => speak(w.ro);
    speak(w.ro);
    const optList = screens.practice.querySelector("#opts");
    opts.forEach(opt => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.className = "option";
      btn.textContent = opt;
      btn.onclick = () => {
        if (btn.disabled) return;
        optList.querySelectorAll("button").forEach(b => b.disabled = true);
        if (opt === w.ru) { score++; btn.classList.add("is-correct"); }
        else btn.classList.add("is-wrong");
        setTimeout(() => { idx++; ask(); }, 600);
      };
      li.appendChild(btn);
      optList.appendChild(li);
    });
  }

  function finish() {
    screens.practice.innerHTML = `
      <button class="back" id="back">← Тренировка</button>
      <div class="head"><h1 class="ro">Аудирование окончено</h1></div>
      <p class="section-title" style="margin-top:0">Правильно: ${score} из ${total}</p>
      <button class="primary" id="again">Ещё раз</button>
    `;
    screens.practice.querySelector("#back").onclick = () => renderPractice();
    screens.practice.querySelector("#again").onclick = () => startListening();
  }

  ask();
}

function startMistakes() {
  const words = loadMistakes();
  if (!words.length) return renderPractice();
  const pool = COURSE.units.flatMap(u => u.words);
  let idx = 0;

  function ask() {
    const remaining = loadMistakes();
    if (idx >= words.length || !remaining.length) return renderPractice();
    const w = words[idx];
    if (!remaining.some(m => m.ro === w.ro)) { idx++; return ask(); }
    const opts = practiceOptions(pool.length ? pool : words, w);
    screens.practice.innerHTML = `
      <button class="back" id="back">← Тренировка</button>
      <div class="head"><h1 class="ro">Работа над ошибками</h1></div>
      <p class="section-title" style="margin-top:0">Осталось: ${remaining.length}</p>
      <div class="card prompt"><p class="subject ro">${w.ro}</p></div>
      <ul class="options" id="opts"></ul>
    `;
    screens.practice.querySelector("#back").onclick = () => renderPractice();
    const optList = screens.practice.querySelector("#opts");
    opts.forEach(opt => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.className = "option";
      btn.textContent = opt;
      btn.onclick = () => {
        if (btn.disabled) return;
        optList.querySelectorAll("button").forEach(b => b.disabled = true);
        if (opt === w.ru) { btn.classList.add("is-correct"); clearMistake(w.ro); }
        else btn.classList.add("is-wrong");
        setTimeout(() => { idx++; ask(); }, opt === w.ru ? 500 : 900);
      };
      li.appendChild(btn);
      optList.appendChild(li);
    });
  }

  ask();
}

/* ---------- Прогресс ---------- */

function renderProgress() {
  const level = "A1";
  const levelUnits = COURSE.units.filter(u => u.level === level && !u.isStory);
  const doneUnits = levelUnits.filter(u => state.done.includes(u.id));
  const wordsLearned = doneUnits.flatMap(u => u.words)
    .filter((w, i, arr) => arr.findIndex(x => x.ro === w.ro) === i).length;

  screens.progress.innerHTML = `
    <div class="head"><h1 class="ro">Мой прогресс</h1></div>
    <div class="card" style="padding:20px; margin-bottom:14px;">
      <p class="section-title" style="margin-top:0">Стрик</p>
      <p style="font-size:32px; font-weight:900; margin:0;">${state.streak > 0 ? state.streak + " " + dayWord(state.streak) : "0 дней"}</p>
    </div>
    <div class="card" style="padding:20px; margin-bottom:14px;">
      <p class="section-title" style="margin-top:0">Юниты курса</p>
      <p style="font-size:32px; font-weight:900; margin:0;">${doneUnits.length} из ${LEVELS[level].totalUnits}</p>
    </div>
    <div class="card" style="padding:20px;">
      <p class="section-title" style="margin-top:0">Слова курса</p>
      <p style="font-size:32px; font-weight:900; margin:0;">${wordsLearned}</p>
    </div>
  `;
}

/* ==========================================================================
   ЧАСТЬ 5. ЗАПУСК
   ========================================================================== */

const saved = loadProgress();
loadSoundPref();

if (saved && state.done.length) {
  // Человек уже занимался — короткое приветствие со стриком, не полная подача.
  renderWelcomeBack();
} else {
  renderWelcome();
}
show("welcome");
</script>
