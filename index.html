<style>
  :root {
    --deep:    #131C33;   /* тёмный фон вводного экрана и итога */
    --ink:     #17203A;
    --paper:   #F0F1F3;
    --card:    #FFFFFF;
    --muted:   #6C7A89;
    --line:    #D7DCE2;
    --brick:   #A8402D;   /* акцент: мотив, действия */
    --gold:    #C0912F;
    --correct: #2E7D5B;
    --wrong:   #A8402D;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  main {
    max-width: 460px;
    margin: 0 auto;
    padding: 18px 16px 96px;
  }

  button { font: inherit; color: inherit; cursor: pointer; }

  .ro { font-family: Newsreader, Georgia, serif; letter-spacing: -0.01em; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }

  .primary {
    width: 100%; font-weight: 500; color: #fff;
    background: var(--ink); border: none; border-radius: 10px; padding: 15px;
  }

  .primary.brick { background: var(--brick); }
  .primary:disabled { background: var(--line); color: var(--muted); cursor: default; }

  .primary:focus-visible, .option:focus-visible, .unit:focus-visible,
  .chip:focus-visible, .icon-btn:focus-visible, .navbtn:focus-visible,
  .setcard:focus-visible, .tab:focus-visible {
    outline: 2px solid var(--brick); outline-offset: 2px;
  }

  .hidden { display: none !important; }

  /* мотив: ромбы из народной вышивки */
  .motif { display: block; width: 100%; height: 14px; color: var(--brick); opacity: .55; }

  /* ============ Вводный экран ============ */

  #screen-welcome {
    position: fixed; inset: 0; z-index: 20;
    background: var(--deep); color: #EFEAE3;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 24px; overflow-y: auto;
  }

  .welcome-inner { max-width: 400px; width: 100%; }

  .welcome-title {
    font-family: Newsreader, Georgia, serif;
    font-size: 56px; font-weight: 600; line-height: 1;
    margin: 0 0 6px; letter-spacing: -0.02em;
  }

  .welcome-sub { color: #A6B0C4; margin: 0 0 26px; font-size: 17px; }

  #screen-welcome .motif { opacity: .8; margin-bottom: 26px; }

  .welcome-list { list-style: none; padding: 0; margin: 0 0 32px; }

  .welcome-list li {
    display: flex; gap: 12px; align-items: baseline;
    padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,.1);
  }

  .welcome-list li:last-child { border-bottom: none; }
  .welcome-list b { font-weight: 500; }
  .welcome-list span { color: #A6B0C4; font-size: 15px; display: block; margin-top: 2px; }
  .welcome-num { font-family: Newsreader, Georgia, serif; color: var(--gold); font-size: 19px; }

  .welcome-foot { text-align: center; color: #7E8AA0; font-size: 13px; margin: 14px 0 0; }

  /* ============ Шапка ============ */

  .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .head h1 { font-family: Newsreader, Georgia, serif; font-size: 27px; font-weight: 600; margin: 0; }
  .streak { font-size: 14px; color: var(--gold); font-weight: 500; }

  .section-title { font-size: 13px; color: var(--muted); margin: 22px 0 10px; }

  /* ============ Юниты ============ */

  .unit {
    display: block; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 10px;
  }

  .unit[data-state="locked"] { opacity: .4; cursor: default; }
  .unit[data-state="done"] { border-color: var(--correct); }
  .unit-name { font-weight: 500; }
  .unit-sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .unit-mark { float: right; font-size: 13px; color: var(--correct); }

  /* ============ Грамматика ============ */

  .note { padding: 24px 22px; margin-bottom: 18px; border-left: 3px solid var(--gold); }
  .note h2 { font-family: Newsreader, Georgia, serif; font-size: 22px; font-weight: 600; margin: 0 0 14px; }
  .note p { margin: 0 0 12px; }
  .note p:last-of-type { margin-bottom: 0; }
  .note b { font-family: Newsreader, Georgia, serif; font-weight: 500; font-size: 17px; }
  .note table { width: 100%; border-collapse: collapse; margin: 16px 0 4px; font-size: 15px; }
  .note td { padding: 7px 0; border-bottom: 1px solid var(--line); }
  .note td:first-child { font-family: Newsreader, Georgia, serif; font-size: 17px; }
  .note td:last-child { color: var(--muted); text-align: right; }
  .note tr:last-child td { border-bottom: none; }

  /* ============ Урок ============ */

  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .track { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--brick); border-radius: 3px; transition: width .3s ease; }
  .quit { background: none; border: none; color: var(--muted); font-size: 24px; line-height: 1; padding: 0 4px; }

  .prompt { padding: 30px 22px 26px; text-align: center; margin-bottom: 20px; }
  .task { font-size: 13px; color: var(--muted); margin: 0 0 16px; }
  .subject { font-size: 38px; line-height: 1.15; margin: 0; }
  .subject.small { font-size: 26px; }
  .icon-btn { background: none; border: none; color: var(--muted); font-size: 20px; padding: 4px 8px; }

  .options { display: grid; gap: 10px; margin: 0 0 20px; padding: 0; list-style: none; }
  .option { width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 15px 18px; }
  .option:hover:not(:disabled) { border-color: var(--ink); }
  .option:disabled { cursor: default; }
  .option.is-correct { border-color: var(--correct); background: #EDF6F1; color: var(--correct); font-weight: 500; }
  .option.is-wrong { border-color: var(--wrong); background: #FAEEEC; color: var(--wrong); }

  .slot { min-height: 56px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; padding: 6px 0 10px; margin-bottom: 18px; }
  .bank { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; min-height: 44px; }
  .chip { font-family: Newsreader, Georgia, serif; font-size: 17px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; }
  .chip.used { visibility: hidden; }

  .answer-input {
    width: 100%; font: inherit; font-family: Newsreader, Georgia, serif;
    font-size: 20px; color: inherit; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px;
  }
  .answer-input:focus { outline: none; border-color: var(--brick); }

  .feedback { min-height: 44px; font-size: 15px; margin-bottom: 12px; }
  .feedback.ok { color: var(--correct); }
  .feedback.bad { color: var(--wrong); }
  .feedback .ro { font-size: 17px; }

  /* ============ Итог ============ */

  .result {
    background: var(--deep); color: #EFEAE3;
    border-radius: 16px; padding: 44px 24px 32px; text-align: center; margin-top: 12px;
  }
  .result .motif { opacity: .7; margin-bottom: 24px; }
  .score { font-family: Newsreader, Georgia, serif; font-size: 62px; line-height: 1; margin: 0 0 6px; }
  .result p { color: #A6B0C4; margin: 0 0 28px; }
  .result .primary { background: var(--brick); }

  /* ============ Словарь ============ */

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1; background: none; border: 1px solid var(--line);
    border-radius: 999px; padding: 9px; font-size: 14px; color: var(--muted);
  }
  .tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

  .search {
    width: 100%; font: inherit; color: inherit; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 16px;
  }
  .search:focus { outline: none; border-color: var(--brick); }

  .entry {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
  }
  .entry-ro { font-family: Newsreader, Georgia, serif; font-size: 18px; }
  .entry-ru { color: var(--muted); font-size: 14px; margin-top: 1px; }
  .entry-text { flex: 1; min-width: 0; }
  .entry-alt { color: var(--muted); font-size: 0.85em; }

  .swatch {
    width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
    border: 1px solid var(--line);
  }
  .num-badge {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    background: var(--paper); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 14px;
  }

  .setcard {
    display: block; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 10px;
  }
  .setcard[data-soon="1"] { opacity: .45; cursor: default; }
  .setcard-name { font-weight: 500; }
  .setcard-sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .setcard-count { float: right; font-size: 13px; color: var(--muted); }

  .back {
    background: none; border: none; color: var(--muted);
    padding: 0; margin-bottom: 14px; font-size: 15px;
  }

  .group-title { font-size: 13px; color: var(--muted); margin: 22px 0 10px; }

  .empty { color: var(--muted); text-align: center; padding: 30px 0; }

  /* ============ Нижняя навигация ============ */

  nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card); border-top: 1px solid var(--line);
    display: flex; padding: 8px 0 22px;
  }

  .navbtn {
    flex: 1; background: none; border: none;
    color: var(--muted); font-size: 13px; padding: 6px 0;
  }
  .navbtn[aria-current="page"] { color: var(--brick); font-weight: 500; }
  .navbtn .glyph { display: block; font-size: 19px; margin-bottom: 2px; }

  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>

/* ---------- Сохранение прогресса ----------
   Прогресс лежит в браузере пользователя, на его устройстве.
   Это временное решение: оно не переносится между телефоном и компьютером.
   Когда появится база и аккаунты, меняется только код внутри
   loadProgress и saveProgress — остальное приложение об этом не знает.

   Всё обёрнуто в try/catch: в режиме инкогнито и в некоторых встроенных
   браузерах хранилище запрещено, и обращение к нему выбрасывает ошибку.
   В таком случае приложение просто работает без сохранения.        */

const STORAGE_KEY = "romana:progress";

function today() {
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}

function yesterday() {
  const d = new Date(Date.now() - 86400000);
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const saved = JSON.parse(raw);

    state.done = Array.isArray(saved.done) ? saved.done : [];
    state.lastDay = saved.lastDay || null;

    // Стрик жив, если последний урок был сегодня или вчера. Иначе сгорел.
    if (state.lastDay === today() || state.lastDay === yesterday()) {
      state.streak = saved.streak || 1;
    } else {
      state.streak = 0;
    }
    return saved;
  } catch (e) {
    return null;   // хранилище недоступно — работаем без сохранения
  }
}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      done: state.done,
      streak: state.streak,
      lastDay: state.lastDay
    }));
  } catch (e) {
    /* не сохранилось — не страшно, урок всё равно засчитан в этой сессии */
  }
}

function markDayDone() {
  const t = today();
  if (state.lastDay === t) return;              // сегодня уже отмечались
  if (state.lastDay === yesterday()) state.streak++;
  else state.streak = 1;                        // первый день или перерыв
  state.lastDay = t;
}

function resetProgress() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  state.done = [];
  state.streak = 0;
  state.lastDay = null;
}

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Сравнение без диакритики: "buna" засчитывается вместо "bună".
function normalize(s) {
  return s.toLowerCase().trim()
    .replace(/ă|â/g, "a").replace(/î/g, "i")
    .replace(/ș|ş/g, "s").replace(/ț|ţ/g, "t")
    .replace(/[.,!?]/g, "").replace(/\s+/g, " ");
}

// Временная озвучка синтезом речи браузера. Настоящее аудио запишут носители.
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ro-RO"; u.rate = 0.9;
  speechSynthesis.speak(u);
}

function unitIndex(id) { return COURSE.units.findIndex(u => u.id === id); }
function isUnlocked(i) { return i === 0 || state.done.includes(COURSE.units[i - 1].id); }

function buildLesson(unit) {
  const idx = unitIndex(unit.id);
  const oldWords = COURSE.units.slice(0, idx).flatMap(u => u.words);
  const allWords = COURSE.units.flatMap(u => u.words);
  const tasks = [];

  shuffle(unit.words).slice(0, 5).forEach(w =>
    tasks.push({ type: "choice", dir: "ro-ru", word: w, pool: allWords }));
  shuffle(unit.words).slice(0, 2).forEach(w =>
    tasks.push({ type: "choice", dir: "ru-ro", word: w, pool: allWords }));
  shuffle(unit.phrases).slice(0, 2).forEach(p =>
    tasks.push({ type: "assemble", phrase: p }));
  shuffle(unit.gaps).slice(0, 2).forEach(g =>
    tasks.push({ type: "gap", gap: g }));

  const typed = shuffle(unit.words.filter(w => !w.ro.includes(" ")))[0];
  if (typed) tasks.push({ type: "input", word: typed });

  shuffle(oldWords).slice(0, 2).forEach(w =>
    tasks.push({ type: "choice", dir: "ro-ru", word: w, pool: allWords }));

  return shuffle(tasks).slice(0, 12);
}

function show(name) {
  Object.entries(screens).forEach(([k, el]) => el.classList.toggle("hidden", k !== name));
  // навигация видна везде, кроме вводного экрана и самого урока
  nav.classList.toggle("hidden", name === "welcome" || name === "lesson");
  nav.querySelectorAll(".navbtn").forEach(b => {
    const active = (b.dataset.go === "dict" && name === "dict") ||
                   (b.dataset.go === "home" && name !== "dict");
    b.setAttribute("aria-current", active ? "page" : "false");
  });
  window.scrollTo(0, 0);
}

nav.querySelectorAll(".navbtn").forEach(b => {
  b.onclick = () => {

      <div class="unit-sub">${unit.sub}</div>

}

function dayWord(n) {
  const last = n % 10, two = n % 100;
  if (two >= 11 && two <= 14) return "дней";
  if (last === 1) return "день";
  if (last >= 2 && last <= 4) return "дня";
  return "дней";
}

/* ---------- Грамматика ---------- */

function startUnit(unit) {
  if (!unit.grammar) return startLesson(unit);
  const g = unit.grammar;
  screens.note.innerHTML = `
    <div class="card note">
      <h2>${g.title}</h2>
      ${g.body.map(p => `<p>${p}</p>`).join("")}
      ${g.table ? `<table>${g.table.map(r =>
        `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table>` : ""}
    </div>
    <button class="primary" id="note-go">Начать урок</button>
  `;
  screens.note.querySelector("#note-go").onclick = () => startLesson(unit);
  show("note");
}

/* ---------- Урок ---------- */

function startLesson(unit) {
  state.current = { unit, tasks: buildLesson(unit) };
  state.step = 0; state.score = 0;
  show("lesson");
  renderTask();
}

function renderTask() {
  const { tasks } = state.current;
  const task = tasks[state.step];
  state.answered = false;

  screens.lesson.innerHTML = `
    <div class="top">
      <button class="quit" id="quit" aria-label="Выйти из урока">&times;</button>
      <div class="track"><div class="fill" style="width:${state.step / tasks.length * 100}%"></div></div>
    </div>
    <div id="body"></div>
    <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    <button class="primary" id="next" disabled>Дальше</button>
  `;

  screens.lesson.querySelector("#quit").onclick = () => { renderHome(); show("home"); };
  screens.lesson.querySelector("#next").onclick = nextTask;

  const body = screens.lesson.querySelector("#body");
  if (task.type === "choice")   renderChoice(body, task);
  if (task.type === "gap")      renderGap(body, task);
  if (task.type === "assemble") renderAssemble(body, task);
  if (task.type === "input")    renderInput(body, task);
}

function renderChoice(body, task) {
  const toRu = task.dir === "ro-ru";
  const w = task.word;
  const question = toRu ? w.ro : w.ru;
  const answer   = toRu ? w.ru : w.ro;

  const wrong = shuffle(task.pool.filter(x => (toRu ? x.ru : x.ro) !== answer))
                  .slice(0, 3).map(x => toRu ? x.ru : x.ro);

  body.innerHTML = `
    <div class="card prompt">
      <p class="task">${toRu ? "Как переводится?" : "Как сказать по-румынски?"}</p>
      <p class="subject ${question.length > 12 ? "small" : ""} ${toRu ? "ro" : ""}">${question}</p>
      ${toRu ? `<button class="icon-btn" id="say" aria-label="Прослушать">🔊</button>` : ""}
    </div>
    <ul class="options" id="options"></ul>
  `;
  if (toRu) body.querySelector("#say").onclick = () => speak(w.ro);
  buildOptions(body, shuffle(wrong.concat(answer)), answer, !toRu);
}

function renderGap(body, task) {
  const g = task.gap;
  body.innerHTML = `
    <div class="card prompt">
      <p class="task">Выберите правильную форму</p>
      <p class="subject small ro">${g.text}</p>
    </div>
    <ul class="options" id="options"></ul>
  `;
  buildOptions(body, shuffle(g.options), g.answer, true);
}

function buildOptions(body, choices, answer, romanian) {
  const list = body.querySelector("#options");
  choices.forEach(choice => {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.className = "option" + (romanian ? " ro" : "");
    btn.textContent = choice;
    btn.onclick = () => {
      if (state.answered) return;
      list.querySelectorAll("button").forEach(b => {
        b.disabled = true;
        if (b.textContent === answer) b.classList.add("is-correct");
      });
      if (choice === answer) finishTask(true);
      else { btn.classList.add("is-wrong"); finishTask(false, answer); }
    };
    li.appendChild(btn);
    list.appendChild(li);
  });
}

function renderAssemble(body, task) {
  const p = task.phrase;
  const words = p.ro.split(" ");

  body.innerHTML = `
    <div class="card prompt">
      <p class="task">Соберите фразу</p>
      <p class="subject small">${p.ru}</p>
    </div>
    <div class="slot" id="slot"></div>
    <div class="bank" id="bank"></div>
  `;

  const slot = body.querySelector("#slot");
  const bank = body.querySelector("#bank");
  const picked = [];

  shuffle(words).forEach(word => {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.textContent = word;
    chip.onclick = () => {
      if (state.answered) return;
      chip.classList.add("used");
      const inSlot = document.createElement("button");
      inSlot.className = "chip";
      inSlot.textContent = word;
      inSlot.onclick = () => {
        if (state.answered) return;
        inSlot.remove();
        chip.classList.remove("used");
        picked.splice(picked.indexOf(inSlot), 1);
        check();
      };
      slot.appendChild(inSlot);
      picked.push(inSlot);
      check();
    };
    bank.appendChild(chip);
  });

  function check() {
    const btn = screens.lesson.querySelector("#next");
    if (picked.length !== words.length) { btn.disabled = true; return; }
    const built = picked.map(c => c.textContent).join(" ");
    if (normalize(built) === normalize(p.ro)) finishTask(true, null, p.ro);
    else finishTask(false, p.ro);
  }
}

function renderInput(body, task) {
  const w = task.word;
  body.innerHTML = `
    <div class="card prompt">
      <p class="task">Напишите по-румынски</p>
      <p class="subject small">${w.ru}</p>
    </div>
    <input class="answer-input ro" id="typed" autocomplete="off"
           autocapitalize="off" spellcheck="false" placeholder="…">
    <button class="primary" id="check" style="margin-bottom:20px">Проверить</button>
  `;

  const input = body.querySelector("#typed");
  const check = body.querySelector("#check");
  input.focus();

  function submit() {
    if (state.answered || !input.value.trim()) return;
    check.remove();
    input.disabled = true;
    if (normalize(input.value) === normalize(w.ro)) finishTask(true, null, w.ro);
    else finishTask(false, w.ro);
  }
  check.onclick = submit;
  input.onkeydown = e => { if (e.key === "Enter") submit(); };
}

function finishTask(ok, correctAnswer, spellNote) {
  state.answered = true;
  const fb = screens.lesson.querySelector("#feedback");
  const next = screens.lesson.querySelector("#next");

  if (ok) {
    state.score++;
    fb.className = "feedback ok";
    fb.innerHTML = spellNote ? `Верно · <span class="ro">${spellNote}</span>` : "Верно";
  } else {
    fb.className = "feedback bad";
    fb.innerHTML = `Правильно: <span class="ro">${correctAnswer}</span>`;
  }
  next.disabled = false;
  next.focus();
}

function nextTask() {
  state.step++;
  if (state.step < state.current.tasks.length) renderTask();
  else {
    if (!state.done.includes(state.current.unit.id)) state.done.push(state.current.unit.id);
    markDayDone();
    saveProgress();
    renderResult();
  }
}

function renderResult() {
  const total = state.current.tasks.length;
  screens.result.innerHTML = `
    <div class="result">
      ${MOTIF}
      <p class="score">${state.score}/${total}</p>
      <p>${state.score === total ? "Без единой ошибки" : "Ошибки вернутся в следующих уроках"}</p>
      <button class="primary" id="back">Дальше</button>
    </div>
  `;
  screens.result.querySelector("#back").onclick = () => { renderHome(); show("home"); };
  show("result");
}

/* ---------- Словарь ---------- */

function renderDict() {
  if (state.openSet) return renderSet(state.openSet);

  screens.dict.innerHTML = `
    <div class="head"><h1 class="ro">Словарь</h1></div>
    <div class="tabs">
      <button class="tab" data-tab="course" aria-selected="${state.tab === "course"}">Слова курса</button>
      <button class="tab" data-tab="topic"  aria-selected="${state.tab === "topic"}">Темы</button>
      <button class="tab" data-tab="work"   aria-selected="${state.tab === "work"}">Работа</button>
    </div>
    <div id="dict-body"></div>
  `;

  screens.dict.querySelectorAll(".tab").forEach(t => {
    t.onclick = () => { state.tab = t.dataset.tab; state.query = ""; renderDict(); };
  });

  const body = screens.dict.querySelector("#dict-body");
  if (state.tab === "course") renderCourseWords(body);
  else renderSetList(body, state.tab);
}

function renderCourseWords(body) {
  body.innerHTML = `
    <input class="search" id="q" placeholder="Поиск по слову или переводу"
           autocomplete="off" spellcheck="false" value="${state.query}">
    <div id="list"></div>
  `;

  const input = body.querySelector("#q");
  input.oninput = () => { state.query = input.value; paint(); };

  function paint() {
    const list = body.querySelector("#list");
    list.innerHTML = "";
    const q = normalize(state.query);
    let shown = 0;

    COURSE.units.forEach(unit => {
      const hits = unit.words.filter(w =>
        !q || normalize(w.ro).includes(q) || w.ru.toLowerCase().includes(q));
      if (!hits.length) return;
      shown += hits.length;
      const h = document.createElement("p");
      h.className = "group-title";
      h.textContent = unit.name;
      list.appendChild(h);
      hits.forEach(w => list.appendChild(entryRow(w)));
    });

    if (!shown) list.innerHTML = '<p class="empty">Ничего не нашлось</p>';
  }
  paint();
}

function renderSetList(body, group) {
  body.innerHTML = "";
  SETS.filter(set => set.group === group).forEach(set => {
    const btn = document.createElement("button");
    btn.className = "setcard";
    btn.dataset.soon = set.soon ? "1" : "0";
    btn.disabled = !!set.soon;
    const count = set.soon ? "скоро"
      : (set.words.length + (set.phrases ? set.phrases.length : 0)) + " слов";
    const icon = set.icon ? `${set.icon} ` : "";
    btn.innerHTML = `
      <span class="setcard-count">${count}</span>
      <div class="setcard-name">${icon}${set.name}</div>
      <div class="setcard-sub">${set.sub}</div>
    `;
    btn.onclick = () => { state.openSet = set; state.query = ""; renderDict(); };
    body.appendChild(btn);
  });
}

function renderSet(set) {
  screens.dict.innerHTML = `
    <button class="back" id="back">← Все наборы</button>
    <div class="head"><h1 class="ro">${set.name}</h1></div>
    <input class="search" id="q" placeholder="Поиск в наборе"
           autocomplete="off" spellcheck="false" value="${state.query}">
    <div id="list"></div>
  `;

  screens.dict.querySelector("#back").onclick = () => {
    state.openSet = null; state.query = ""; renderDict();
  };

  const input = screens.dict.querySelector("#q");
  input.oninput = () => { state.query = input.value; paint(); };

  function paint() {
    const list = screens.dict.querySelector("#list");
    list.innerHTML = "";
    const q = normalize(state.query);
    const match = arr => (arr || []).filter(w =>
      !q || normalize(w.ro).includes(q) || w.ru.toLowerCase().includes(q));

    const words = match(set.words);
    const phrases = match(set.phrases);

    if (words.length) {
      const h = document.createElement("p");
      h.className = "group-title"; h.textContent = "Слова";
      list.appendChild(h);
      words.forEach(w => list.appendChild(entryRow(w)));
    }
    if (phrases.length) {
      const h = document.createElement("p");
      h.className = "group-title"; h.textContent = "Фразы";
      list.appendChild(h);
      phrases.forEach(w => list.appendChild(entryRow(w)));
    }
    if (!words.length && !phrases.length)
      list.innerHTML = '<p class="empty">Ничего не нашлось</p>';
  }
  paint();
}

function entryRow(w) {
  const row = document.createElement("div");
  row.className = "entry";

  // цвета несут hex-код, числа несут n — по ним и отличаем оформление
  const badge = w.hex ? `<span class="swatch" style="background:${w.hex}"></span>`
              : typeof w.n === "number" ? `<span class="num-badge">${w.n}</span>`
              : "";
  const roLine = w.roF && w.roF !== w.ro ? `${w.ro} <span class="entry-alt">${w.roF}</span>` : w.ro;
  const ruLine = w.ruF && w.ruF !== w.ru ? `${w.ru} <span class="entry-alt">${w.ruF}</span>` : w.ru;

  row.innerHTML = `
    ${badge}
    <div class="entry-text">
      <div class="entry-ro">${roLine}</div>
      <div class="entry-ru">${ruLine}</div>
    </div>
    <button class="icon-btn" aria-label="Прослушать">🔊</button>
  `;
  row.querySelector("button").onclick = () => speak(w.ro);
  return row;
}

/* ==========================================================================
   ЧАСТЬ 5. ЗАПУСК
   ========================================================================== */

const saved = loadProgress();

if (saved && state.done.length) {
  // Человек уже занимался — вводный экран ему не нужен, сразу к урокам.
  renderHome();
  show("home");
} else {
  renderWelcome();
  show("welcome");
}
</script>
